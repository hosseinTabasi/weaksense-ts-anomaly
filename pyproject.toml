[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weaksense-ts-anomaly"
version = "0.1.0"
description = "Industrial time-series representation learning: weaksense-ts-anomaly"
authors = [{name = "Hossein Tabasi"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "matplotlib", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
